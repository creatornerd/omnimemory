<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniMemory — chatbot fixture</title>
    <style>
      /* A stand-in chat page. Deliberately hostile-ish CSS to prove isolation. */
      html { font-size: 20px; }
      body { margin: 0; font: 16px/1.5 Georgia, serif; background: var(--page); color: var(--fg); }
      body.light { --page: #ffffff; --fg: #222; --box: #f4f4f4; --line: #ddd; }
      body.dark { --page: #212121; --fg: #eee; --box: #303030; --line: #444; }
      button { background: hotpink; padding: 20px; }
      nav { display: flex; gap: 12px; padding: 12px 20px; font-size: 13px; border-bottom: 1px solid var(--line); }
      nav a { color: inherit; }
      nav a[aria-current] { font-weight: bold; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 20px 220px; }
      .msg { margin: 0 0 18px; padding: 10px 14px; border-radius: 14px; }
      .msg.user { background: var(--box); margin-left: 120px; }
      .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 20px 24px; background: var(--page); }
      form, fieldset, .input-area-container {
        max-width: 720px; margin: 0 auto; padding: 12px 16px; border: 1px solid var(--line);
        border-radius: 24px; background: var(--box); display: block;
      }
      .ProseMirror, .ql-editor { min-height: 48px; max-height: 200px; overflow: auto; outline: none; white-space: pre-wrap; }
      .ProseMirror p, .ql-editor p { margin: 0; }
      .ql-clipboard { position: absolute; left: -100000px; height: 1px; overflow: hidden; }
    </style>
  </head>
  <body class="dark">
    <nav id="nav"></nav>
    <main id="chat"></main>
    <div class="dock" id="dock"></div>
    <script type="module" src="/dev/fixture.ts"></script>
  </body>
</html>
